name: Seva model tests

on:
  push:
    branches: [main]
    paths:
      - "Recipient-Prediction-Model-V2-Fast/**"
      - ".github/workflows/seva-tests.yml"
  pull_request:
    paths:
      - "Recipient-Prediction-Model-V2-Fast/**"
      - ".github/workflows/seva-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Recipient-Prediction-Model-V2-Fast
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Recipient-Prediction-Model-V2-Fast/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
